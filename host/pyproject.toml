[project]
name = "lecture-capture-host"
version = "0.1.0"
description = "Host ingestion server for Lecture Capture"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlite-utils>=3.37",
    "python-multipart>=0.0.6",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dateutil>=2.8",
    "loguru>=0.7",
    "faster-whisper>=1.0",
    "requests>=2.31",
    "dateparser>=1.2",
    "qrcode>=7.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "ruff>=0.2",
    "mypy>=1.7",
]
